apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kube-ups-taint.fullname" . }}
  labels:
    {{- include "kube-ups-taint.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kube-ups-taint.fullname" . }}
  labels:
    {{- include "kube-ups-taint.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kube-ups-taint.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kube-ups-taint.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
